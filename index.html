<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pivovarnická Varna - Velín</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        scada: { bg: '#d4d8df', card: '#e2e8f0', border: '#94a3b8', text: '#1e293b' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#1a1d24] text-gray-100 font-sans select-none h-screen flex flex-col justify-between overflow-hidden">

    <!-- HORNÍ LIŠTA (Programy a stav jako ve velínu) -->
    <header class="bg-[#2a2e39] border-b border-gray-700 px-3 py-2 flex items-center justify-between text-xs">
        <div class="flex items-center gap-2 overflow-x-auto">
            <span class="text-gray-400 font-bold">Programy:</span>
            <span class="bg-green-700 text-white px-2 py-0.5 rounded font-bold">P15</span>
            <span class="bg-green-700 text-white px-2 py-0.5 rounded font-bold">P16</span>
            <span class="bg-green-700 text-white px-2 py-0.5 rounded font-bold">P21</span>
            <span class="text-gray-500 bg-gray-800 px-2 py-0.5 rounded">P23</span>
        </div>
        <div class="text-amber-400 font-bold">Únětice 10,7%</div>
    </header>

    <!-- HLAVNÍ OBSAH (SCADA Schéma varny) -->
    <main id="app-content" class="flex-1 overflow-y-auto relative p-3">
        <!-- Zde se dynamicky načítají obrazovky -->
    </main>

    <!-- SPODNÍ NAVIGACE -->
    <nav class="h-16 bg-[#2a2e39] border-t border-gray-700 flex justify-around items-center z-50 shadow-2xl">
        <button onclick="zmenZalozku('varna')" id="nav-varna" class="flex flex-col items-center text-amber-400 transition py-1 px-3">
            <i class="fa-solid fa-industry text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Velín / Schéma</span>
        </button>
        <button onclick="zmenZalozku('receptury')" id="nav-receptury" class="flex flex-col items-center text-gray-400 transition py-1 px-3">
            <i class="fa-solid fa-book text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Receptury</span>
        </button>
        <button onclick="zmenZalozku('sklad')" id="nav-sklad" class="flex flex-col items-center text-gray-400 transition py-1 px-3">
            <i class="fa-solid fa-warehouse text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Sklad</span>
        </button>
        <button onclick="zmenZalozku('archiv')" id="nav-archiv" class="flex flex-col items-center text-gray-400 transition py-1 px-3">
            <i class="fa-solid fa-chart-line text-lg"></i>
            <span class="text-[10px] mt-1 font-medium">Archiv</span>
        </button>
    </nav>

    <script>
        const obrazovky = {
            varna: `
                <div class="flex flex-col space-y-4 max-w-lg mx-auto pb-6">
                    
                    <!-- 1. NÁDRŽ: Vystírací kád -->
                    <div class="bg-[#222631] border border-gray-700 rounded-xl p-3 relative shadow-xl">
                        <!-- Plovoucí okno nad nádobou (přesně jako na velínu) -->
                        <div class="bg-[#e2e8f0] text-[#1e293b] rounded-lg p-2.5 mb-3 shadow border-t-4 border-green-600">
                            <div class="flex justify-between items-center mb-1 font-bold text-xs bg-green-200 px-2 py-0.5 rounded">
                                <span>P15 - Vystírací kád</span>
                                <span class="text-green-800">OK</span>
                            </div>
                            <div class="grid grid-cols-2 gap-2 text-[11px]">
                                <div>Čekání na RØ: <b class="text-blue-900">20</b></div>
                                <div>Únětice 10,7%</div>
                                <div>Zbytek čas: <b class="text-red-700">1:1</b></div>
                                <div>Šarže: 608</div>
                            </div>
                        </div>

                        <!-- Vizuální nákres nádoby -->
                        <div class="h-36 border-2 border-dashed border-gray-600 rounded-lg relative flex items-center justify-center bg-[#181b22]">
                            <div class="text-gray-500 font-bold text-xs tracking-wider">VYSTÍRACÍ KÁD</div>
                            <!-- Teploměr / Indikace -->
                            <div class="absolute bottom-2 bg-gray-900 border border-gray-600 px-3 py-1 rounded text-xs font-bold text-green-400">
                                52.1 °C
                            </div>
                        </div>
                    </div>

                    <!-- PROPOJCOVÉ POTRUBÍ S ČERPADLEM -->
                    <div class="flex items-center justify-center gap-3 py-1">
                        <div class="h-1 flex-1 bg-blue-500/50 rounded"></div>
                        <div class="bg-blue-950 border border-blue-500 px-3 py-1 rounded-lg text-xs font-bold text-blue-400 flex items-center gap-1.5 shadow">
                            <i class="fa-solid fa-water animate-pulse"></i> Čerpadlo (Aktivní)
                        </div>
                        <div class="h-1 flex-1 bg-blue-500/50 rounded"></div>
                    </div>

                    <!-- 2. NÁDRŽ: Rmutovací pánev -->
                    <div class="bg-[#222631] border border-gray-700 rounded-xl p-3 relative shadow-xl">
                        <!-- Plovoucí okno nad nádobou -->
                        <div class="bg-[#e2e8f0] text-[#1e293b] rounded-lg p-2.5 mb-3 shadow border-t-4 border-green-600">
                            <div class="flex justify-between items-center mb-1 font-bold text-xs bg-green-200 px-2 py-0.5 rounded">
                                <span>P16 - Rmutovací pánev</span>
                                <span class="text-green-800">OK</span>
                            </div>
                            <div class="grid grid-cols-2 gap-2 text-[11px]">
                                <div>Zcukření při 64°C: <b class="text-blue-900">10</b></div>
                                <div>Únětice 10,7%</div>
                                <div>Zbytek čas: <b class="text-red-700">52</b> min</div>
                                <div>Šarže: 608</div>
                            </div>
                        </div>

                        <!-- Vizuální nákres nádoby -->
                        <div class="h-36 border-2 border-dashed border-gray-600 rounded-lg relative flex items-center justify-center bg-[#181b22]">
                            <div class="text-gray-500 font-bold text-xs tracking-wider">RMUTOVACÍ PÁNEV</div>
                            <!-- Teploměr / Indikace -->
                            <div class="absolute bottom-2 bg-gray-900 border border-gray-600 px-3 py-1 rounded text-xs font-bold text-green-400">
                                64.8 °C
                            </div>
                        </div>
                    </div>

                </div>
            `,
            receptury: `
                <div class="p-4 space-y-3 max-w-md mx-auto">
                    <h2 class="text-base font-bold text-amber-400 mb-2">Receptury a kalkulačka</h2>
                    <div class="bg-[#222631] border border-gray-700 p-4 rounded-xl">
                        <div class="font-bold text-sm text-white">Únětice 10,7% (Světlé výčepní)</div>
                        <div class="text-xs text-gray-400 mt-1">EPM: 10.7°P | IBU: 28 | EBC: 8 | ABV: 4.1%</div>
                    </div>
                </div>
            `,
            sklad: `
                <div class="p-4 space-y-3 max-w-md mx-auto">
                    <h2 class="text-base font-bold text-amber-400 mb-2">Skladové hospodářství</h2>
                    <div class="bg-[#222631] border border-gray-700 p-3.5 rounded-xl flex justify-between items-center">
                        <div>
                            <div class="font-bold text-sm text-white">Plzeňský slad</div>
                            <div class="text-xs text-gray-400 mt-0.5">Zásoba: 25.5 kg (Min: 10 kg)</div>
                        </div>
                        <i class="fa-solid fa-circle-check text-green-500 text-lg"></i>
                    </div>
                </div>
            `,
            archiv: `
                <div class="p-4 space-y-3 max-w-md mx-auto">
                    <h2 class="text-base font-bold text-amber-400 mb-2">Archiv a grafy várek</h2>
                    <div class="bg-[#222631] border border-gray-700 p-4 rounded-xl">
                        <div class="font-bold text-sm text-white">Várka #608 (Únětice 10,7%)</div>
                        <div class="text-xs text-gray-400 mt-1">Stav: Probíhá vaření (Rmutovací pánev)</div>
                    </div>
                </div>
            `
        };

        function zmenZalozku(nazev) {
            document.getElementById('app-content').innerHTML = obrazovky[nazev];
            ['varna', 'receptury', 'sklad', 'archiv'].forEach(z => {
                const btn = document.getElementById('nav-' + z);
                if (z === nazev) {
                    btn.classList.remove('text-gray-400');
                    btn.classList.add('text-amber-400');
                } else {
                    btn.classList.remove('text-amber-400');
                    btn.classList.add('text-gray-400');
                }
            });
        }

        window.onload = () => zmenZalozku('varna');
    </script>
</body>
</html>
